### model
latent_action_model_config: 
  _target_: uni_world_model.latent_action_model.models.latent_action_tokenizer.LatentActionTokenizer
  ## image channel
  in_dim: 3
  model_dim: 768
  latent_dim: 128 
  num_latents: 16 
  patch_size: 14
  enc_blocks: 12
  dec_blocks: 12
  num_heads: 12
  action_num_codes: 4 
  loss_config:
    use_abs_recons_loss: False
    commit_loss_w: 1.0
    recon_loss_w: 1.0
    perceptual_loss_w: 1.0

### dataset
dataset_config:
  # data_type: "video_npz"
  data_type: "video_npz_3seq"
  npz_dir: "/mnt/workspace/tangzuojin.tzj/task_ABC_D" 
  # npz_dir: "/mnt/nas-data-3/zjtang/task_ABC_D"
  rgb_shape: [200, 200]
  skip_frame: 10 # 10,3
  small_data: False

dataloader_config:
  bs_per_gpu: 32
  workers_per_gpu: 7
  prefetch_factor: 2

rgb_preprocessor_config: 
  model_vision_type: "raw"
  vision_aug_config: 
    do_random_resized_crop: false
    do_random_shift: true

### training
training_config:
  num_epochs: 60
  num_warmup_epochs: 1
  print_steps: 10
  lr_max: 0.0001
  weight_decay: 0.0001
  gradient_accumulation_steps: 2
  save_epochs: 1
  save_steps: 1000
