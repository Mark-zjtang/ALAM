### model
latent_action_model_config: 
  _target_: uni_world_model.latent_action_model.models.latent_action_tokenizer.LatentActionTokenizer
  ## image channel
  in_dim: 3
  model_dim: 768
  latent_dim: 128
  num_latents: 256
  patch_size: 14
  enc_blocks: 12
  dec_blocks: 12
  num_heads: 12
  action_num_codes: 7
  loss_config:
    use_abs_recons_loss: False
    commit_loss_w: 1.0
    recon_loss_w: 1.0
    perceptual_loss_w: 1.0

