dataloader_config:
  bs_per_gpu: 32
  workers_per_gpu: 7
  prefetch_factor: 2

rgb_preprocessor_config: 
  model_vision_type: "raw"
  vision_aug_config: 
    do_random_resized_crop: false
    do_random_shift: true

### training
training_config:
  num_epochs: 200
  num_warmup_epochs: 2
  print_steps: 10
  lr_max: 0.0001
  weight_decay: 0.0001
  gradient_accumulation_steps: 2
  save_epochs: 2
  save_steps: 1000
  save_path: "/mnt/workspace/tangzuojin.tzj/debug_result/UniWorldModel-oxe-skipframe5-calvin-skipframe10/logs/latent_action_tokenizer_trained_on_calvin/"
  resume_ckpt_path: null